name: Deploy files to aaPanel via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-ftp-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Upload project files
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Upload files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ./
          timeout: 120000
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env
            **/.env.backup*
            **/.env.production*
            **/vendor/**
            **/node_modules/**
            **/public/build/**
            **/public/hot
            **/public/storage
            **/storage/logs/**
            **/storage/framework/cache/**
            **/storage/framework/sessions/**
            **/storage/framework/views/**
            **/.phpunit.cache/**
            **/.phpunit.result.cache
            **/install-report.log
