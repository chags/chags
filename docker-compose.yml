services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: chags-app
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:9080
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: chagsdb
      DB_USERNAME: chags
      DB_PASSWORD: chags
      MAIL_MAILER: smtp
      MAIL_SCHEME: null
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USERNAME: null
      MAIL_PASSWORD: null
      MAIL_FROM_ADDRESS: no-reply@chags.local
      MAIL_FROM_NAME: Chags
    command: >
      sh -c "composer install --no-interaction --prefer-dist &&
      chown -R www-data:www-data storage bootstrap/cache &&
      find storage bootstrap/cache -type d -exec chmod 775 {} + &&
      find storage bootstrap/cache -type f -exec chmod 664 {} + &&
      php artisan migrate --force &&
      chown -R www-data:www-data storage bootstrap/cache &&
      php-fpm"
    networks:
      - chags

  nginx:
    image: nginx:alpine
    container_name: chags-nginx
    ports:
      - "9080:80"
    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - chags

  postgres:
    image: postgres:16-alpine
    container_name: chags-postgres
    environment:
      POSTGRES_DB: chagsdb
      POSTGRES_USER: chags
      POSTGRES_PASSWORD: chags
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chags -d chagsdb"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - chags

  mailpit:
    image: axllent/mailpit:latest
    container_name: chags-mailpit
    restart: unless-stopped
    ports:
      - "1026:1025"
      - "8026:8025"
    networks:
      - chags

networks:
  chags:
    driver: bridge

volumes:
  postgres_data:
